kind: wasmer.io/App.v0
name: sipbarang-smkn1ciomas
owner: noviaauliaputri
package: .

capabilities:
  database:
    engine: mysql

jobs:
  - name: migrate-database
    trigger: pre-deployment
    timeout: 5m
    action:
      execute:
        command: php
        cli_args:
          - /app/artisan
          - migrate
          - --force